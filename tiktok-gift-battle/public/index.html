<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Gift Battle</title>
  <style>
    @font-face { font-family: 'Bungee'; src: url('/vendor/fonts/bungee/files/bungee-latin-400-normal.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Rubik'; font-weight: 600; src: url('/vendor/fonts/rubik/files/rubik-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Rubik'; font-weight: 800; src: url('/vendor/fonts/rubik/files/rubik-latin-800-normal.woff2') format('woff2'); }

    :root {
      --red: #ff3355;
      --red-hot: #ff8a3d;
      --blue: #22a6ff;
      --blue-deep: #5b5cff;
      --gold: #ffd54a;
      --ink: #14052b;
      --panel: rgba(14, 6, 34, 0.62);
      --line: rgba(255, 255, 255, 0.2);
    }
    /* Designed for a 1080x1920 portrait screen: 1rem = 1/54 of the width */
    html { font-size: min(calc(100vw / 54), calc(100vh / 96)); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #07031a; color: #fff; font-family: 'Rubik', system-ui, sans-serif; font-weight: 600; }
    [hidden] { display: none !important; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    #hud {
      position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: min(100vw, 56.25vh); box-sizing: border-box; padding: 2.4rem 2rem 2.2rem;
      display: flex; flex-direction: column; pointer-events: none;
    }
    .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 1rem; }
    .team { display: flex; flex-direction: column; min-width: 0; }
    .team.blue { align-items: flex-end; text-align: right; }
    .fighter-name { font-family: 'Bungee', sans-serif; font-size: 2.5rem; line-height: 1; letter-spacing: 0.04em; }
    .team.red .fighter-name { color: #ffd2da; text-shadow: 0 0 1.4rem var(--red), 0 0.25rem 0 #5a0016; }
    .team.blue .fighter-name { color: #d4efff; text-shadow: 0 0 1.4rem var(--blue), 0 0.25rem 0 #062a5a; }
    .total { font-family: 'Bungee', sans-serif; font-size: 3.6rem; line-height: 1.15; text-shadow: 0 0.3rem 0 var(--ink), 0 0 1.2rem rgba(0, 0, 0, 0.6); }
    .total small { font-size: 0.55em; vertical-align: 0.35em; }
    .clock {
      text-align: center; background: var(--panel); border: 0.2rem solid var(--line); border-radius: 1.8rem;
      padding: 0.7rem 1.6rem 0.8rem; backdrop-filter: blur(6px); min-width: 9rem;
    }
    .round { font-size: 1.3rem; letter-spacing: 0.18em; opacity: 0.8; }
    .time { font-family: 'Bungee', sans-serif; font-size: 3.6rem; line-height: 1; }
    .time.hurry { color: var(--gold); text-shadow: 0 0 1.2rem var(--red); }

    .power {
      position: relative; height: 3.4rem; margin-top: 1.4rem; border-radius: 1.7rem;
      background: linear-gradient(90deg, var(--blue), var(--blue-deep));
      box-shadow: 0 0 2.4rem rgba(0, 0, 0, 0.55), inset 0 0 0 0.25rem rgba(255, 255, 255, 0.28);
    }
    #bar-red {
      position: absolute; inset: 0 auto 0 0; border-radius: 1.7rem 0 0 1.7rem;
      background: linear-gradient(90deg, var(--red-hot), var(--red));
      box-shadow: inset 0 0 0 0.25rem rgba(255, 255, 255, 0.28);
    }
    .power span { position: absolute; top: 50%; transform: translateY(-50%); font-family: 'Bungee', sans-serif; font-size: 1.7rem; text-shadow: 0 0.2rem 0 rgba(0, 0, 0, 0.45); }
    #pct-red { left: 1.4rem; }
    #pct-blue { right: 1.4rem; }
    #spark {
      position: absolute; top: 50%; width: 4.6rem; height: 4.6rem; transform: translate(-50%, -50%);
      border-radius: 50%; background: radial-gradient(circle, #fff 0 22%, rgba(255, 240, 180, 0.9) 34%, rgba(255, 213, 74, 0) 70%);
      filter: drop-shadow(0 0 0.8rem #fff);
    }

    .supporters { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; margin-top: 1rem; }
    .supporters ol { list-style: none; margin: 0; padding: 0.6rem 0.9rem; border-radius: 1.2rem; font-size: 1.45rem; min-height: 1rem; }
    .supporters ol:empty { visibility: hidden; }
    #top-red { background: linear-gradient(90deg, rgba(255, 51, 85, 0.38), rgba(255, 51, 85, 0)); }
    #top-blue { background: linear-gradient(270deg, rgba(34, 166, 255, 0.38), rgba(34, 166, 255, 0)); }
    .supporters li { display: flex; gap: 0.5rem; align-items: center; line-height: 1.55; }
    #top-blue li { flex-direction: row-reverse; }
    .supporters .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .supporters .gems { color: var(--gold); font-weight: 800; }

    #feed { margin-top: auto; display: flex; flex-direction: column; gap: 0.7rem; }
    .toast {
      display: flex; align-items: center; gap: 0.9rem; max-width: 82%; width: fit-content;
      padding: 0.45rem 1.4rem 0.45rem 0.45rem; border-radius: 3rem; font-size: 1.75rem;
      box-shadow: 0 0.4rem 1.4rem rgba(0, 0, 0, 0.35);
    }
    .toast.red { align-self: flex-start; background: linear-gradient(90deg, rgba(255, 51, 85, 0.92), rgba(255, 51, 85, 0.35)); }
    .toast.blue { align-self: flex-end; flex-direction: row-reverse; padding: 0.45rem 0.45rem 0.45rem 1.4rem; background: linear-gradient(270deg, rgba(34, 140, 255, 0.92), rgba(34, 140, 255, 0.35)); }
    .toast-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast-text b { font-weight: 800; }
    .toast-gems { font-family: 'Bungee', sans-serif; color: var(--gold); text-shadow: 0 0.2rem 0 rgba(0, 0, 0, 0.5); white-space: nowrap; }
    .avatar {
      position: relative; flex: none; width: 3.6rem; height: 3.6rem; border-radius: 50%; overflow: hidden;
      display: grid; place-items: center; font-family: 'Bungee', sans-serif; font-size: 1.6rem;
      border: 0.2rem solid rgba(255, 255, 255, 0.85);
    }
    .avatar.red { background: linear-gradient(135deg, var(--red-hot), var(--red)); }
    .avatar.blue { background: linear-gradient(135deg, var(--blue), var(--blue-deep)); }
    .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

    .howto {
      margin-top: 1.2rem; text-align: center; font-size: 1.7rem; line-height: 1.5;
      background: var(--panel); border: 0.15rem solid var(--line); border-radius: 1.8rem; padding: 0.9rem 1rem;
      backdrop-filter: blur(6px);
    }
    .key { display: inline-block; font-family: 'Bungee', sans-serif; padding: 0 0.7rem; border-radius: 0.6rem; margin: 0 0.2rem; }
    .key.red { background: var(--red); }
    .key.blue { background: var(--blue); }

    #overlay { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    #flash { position: fixed; inset: 0; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
    .callout, .countdown, .result { position: absolute; left: 50%; top: 31%; transform: translate(-50%, -50%); text-align: center; }
    .result { top: 74%; }
    .callout { font-family: 'Bungee', sans-serif; white-space: nowrap; }
    .callout-main { font-size: calc(7.5rem * var(--size, 1)); line-height: 1; color: #fff; text-shadow: 0 0.55rem 0 var(--ink), 0 0 3rem rgba(255, 255, 255, 0.55); }
    .callout.red .callout-main { color: #ffe1e6; text-shadow: 0 0.55rem 0 #5a0016, 0 0 3rem var(--red); }
    .callout.blue .callout-main { color: #e1f4ff; text-shadow: 0 0.55rem 0 #062a5a, 0 0 3rem var(--blue); }
    .callout-sub { font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 2.3rem; margin-top: 0.8rem; text-shadow: 0 0.2rem 0.8rem #000; }
    .countdown { font-family: 'Bungee', sans-serif; font-size: 20rem; line-height: 1; color: var(--gold); text-shadow: 0 0.8rem 0 var(--ink), 0 0 4rem var(--red); }
    .damage { position: absolute; font-family: 'Bungee', sans-serif; font-size: 2.6rem; white-space: nowrap; text-shadow: 0 0.25rem 0 var(--ink), 0 0 1rem rgba(0, 0, 0, 0.6); }
    .damage.red { color: #ffc2cd; }
    .damage.blue { color: #c2e8ff; }
    .damage.big { font-size: 4.4rem; color: var(--gold); }

    .result {
      width: 46rem; box-sizing: border-box; padding: 2.2rem 2rem 1.8rem; border-radius: 2.6rem;
      background: rgba(14, 6, 34, 0.78); border: 0.3rem solid var(--line); backdrop-filter: blur(10px);
    }
    .result.red { border-color: var(--red); box-shadow: 0 0 5rem rgba(255, 51, 85, 0.55); }
    .result.blue { border-color: var(--blue); box-shadow: 0 0 5rem rgba(34, 166, 255, 0.55); }
    .result-title { font-family: 'Bungee', sans-serif; font-size: 4.8rem; line-height: 1.1; }
    .result.red .result-title { color: #ffe1e6; text-shadow: 0 0 2rem var(--red); }
    .result.blue .result-title { color: #e1f4ff; text-shadow: 0 0 2rem var(--blue); }
    .result-score { font-family: 'Bungee', sans-serif; font-size: 2.3rem; margin-top: 0.8rem; opacity: 0.95; }
    .result-mvp { display: flex; align-items: center; justify-content: center; gap: 0.9rem; margin-top: 1.4rem; font-size: 2.1rem; }
    .result-mvp .crown { font-family: 'Bungee', sans-serif; color: var(--gold); }
    .result-mvp span:last-child { color: var(--gold); font-weight: 800; }
    .result-next { margin-top: 1.4rem; font-size: 1.8rem; opacity: 0.85; }

    #loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: 'Bungee', sans-serif; font-size: 3rem; letter-spacing: 0.1em; }
    #sound-hint {
      position: fixed; right: 1.6rem; bottom: 1.6rem; font: inherit; font-size: 1.6rem; color: #fff; cursor: pointer;
      background: var(--panel); border: 0.15rem solid var(--line); border-radius: 1.4rem; padding: 0.7rem 1.2rem;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud" hidden>
    <header class="top">
      <div class="team red">
        <div class="fighter-name">🔥 BLAZE</div>
        <div class="total"><small>💎</small><span id="red-total">0</span></div>
      </div>
      <div class="clock">
        <div class="round" id="round">ROUND 1</div>
        <div class="time" id="time">2:00</div>
      </div>
      <div class="team blue">
        <div class="fighter-name">FROST ❄️</div>
        <div class="total"><span id="blue-total">0</span><small>💎</small></div>
      </div>
    </header>
    <div class="power">
      <div id="bar-red"></div>
      <span id="pct-red">50%</span>
      <span id="pct-blue">50%</span>
      <div id="spark"></div>
    </div>
    <div class="supporters">
      <ol id="top-red"></ol>
      <ol id="top-blue"></ol>
    </div>
    <div id="feed"></div>
    <footer class="howto">
      💬 Comment <span class="key red">1</span> for BLAZE · <span class="key blue">2</span> for FROST<br>
      🎁 Every gift makes your robot attack!
    </footer>
  </div>

  <div id="overlay">
    <div id="result" class="result" hidden></div>
  </div>
  <div id="flash"></div>
  <div id="loading">Loading…</div>
  <button id="sound-hint" hidden>🔊 Click for sound</button>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/game.js"></script>
</body>
</html>
